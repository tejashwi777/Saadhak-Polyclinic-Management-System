{% extends 'clinic/base.html' %}
{% block content %}
<div class="container-fluid">
    <h2 class="display-6 fw-bold mb-4">Admin Profile Management</h2>
    
    <form method="POST">
        {% csrf_token %}
        <div class="card shadow-lg p-4 border-0">
            <h4 class="card-title mb-4">Account Details</h4>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    {{ form.as_p }}  </div>
            </div>
            
            <button type="submit" class="btn btn-warning white fw-bold">Update Account Info</button>
        </div>
    </form>

    <div class="card shadow-lg p-4 mt-4 border-0">
        <h4 class="card-title mb-3">Security</h4>
        <a href="{% url 'password_change' %}" class="btn btn-warning w-100 fw-bold">Change Password</a>
    </div>
</div>
{% endblock %}
