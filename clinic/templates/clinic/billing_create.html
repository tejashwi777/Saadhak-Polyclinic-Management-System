<h2>Create Bill</h2>

<form method="post">
    {% csrf_token %}

    <label>Patient:</label>
    <select name="patient" required>
        {% for p in patients %}
        <option value="{{ p.id }}">{{ p }}</option>
        {% endfor %}
    </select><br><br>

    <label>Appointment (optional):</label>
    <select name="appointment">
        <option value="">----</option>
        {% for a in appointments %}
        <option value="{{ a.id }}">{{ a }}</option>
        {% endfor %}
    </select><br><br>

    <label>Consultation Fee:</label>
    <input type="number" step="0.01" name="consultation_fee"><br><br>

    <label>Lab Fee:</label>
    <input type="number" step="0.01" name="lab_fee"><br><br>

    <label>Medicine Fee:</label>
    <input type="number" step="0.01" name="medicine_fee"><br><br>

    <button type="submit">Generate Bill</button>
</form>
