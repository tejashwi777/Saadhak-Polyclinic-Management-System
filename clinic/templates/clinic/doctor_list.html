<!-- clinic/templates/clinic/doctor_list.html -->
{% extends 'clinic/base.html' %}
{% block content %}
<h2>Doctors</h2>
<a class="btn btn-success mb-3" href="{% url 'doctor_register' %}">Add Doctor</a>
<table class="table table-striped">
  <thead><tr><th>Username</th><th>Name</th><th>Specialization</th><th>Phone</th></tr></thead>
  <tbody>
    {% for d in doctors %}
      <tr>
        <td>{{ d.user.username }}</td>
        <td>{{ d.user.get_full_name }}</td>
        <td>{{ d.specialization }}</td>
        <td>{{ d.phone }}</td>
      </tr>
    {% empty %}
      <tr><td colspan="4">No doctors yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
