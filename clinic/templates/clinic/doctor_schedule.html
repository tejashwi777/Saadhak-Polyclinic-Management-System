{% extends 'clinic/base.html' %}
{% block title %}My Schedule{% endblock %}

{% block content %}
<h2>My Schedule</h2>
<hr>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-success" type="submit">Add/Update</button>
</form>

<h5 class="mt-3">Upcoming</h5>
<table class="table">
  <thead><tr><th>Date</th><th>From</th><th>To</th></tr></thead>
  <tbody>
    {% for s in schedules %}
    <tr>
      <td>{{ s.date }}</td>
      <td>{{ s.start_time }}</td>
      <td>{{ s.end_time }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="3" class="text-center">No schedule</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
