{% extends 'clinic/base.html' %}
{% load static %}

{% block title %}Upload Lab Report{% endblock %}

{% block content %}
<div class="container-fluid">
    <h2 class="mb-4 display-6 fw-bold" style="color: #2C3E50;">Upload Lab Report</h2>

    <div class="card shadow-lg rounded-3" style="max-width: 600px; margin: auto;">
        <div class="card-header bg-white border-bottom p-4">
            <h5 class="fw-bold mb-0" style="color: #2C3E50;">Report Details</h5>
        </div>
        <div class="card-body p-4">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                
                {% for field in form %}
                    <div class="mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label fw-bold">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="alert alert-danger mt-1 small">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                {% endfor %}

                <button type="submit" class="btn btn-primary btn-lg w-100 mt-4 text-white" style="color: white !important;">
                    <i class="bi bi-upload me-2"></i> Upload Report
                </button>
            </form>
        </div>
    </div>
</div>

<style>
/* Custom styling for form elements not handled by form.as_p */
/* This forces inputs to use full width and match Bootstrap style */
.card-body input[type="text"],
.card-body input[type="file"],
.card-body select {
    width: 100%;
    padding: 0.375rem 0.75rem;
    font-size: 1rem;
    line-height: 1.5;
    color: #495057;
    background-color: #fff;
    background-clip: padding-box;
    border: 1px solid #ced4da;
    border-radius: 0.25rem;
    transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
}
/* Ensure file input appears correctly, though its style is hard to control */
.card-body input[type="file"] {
    padding: 0.375rem 0; /* Adjust padding for file input */
}
</style>
{% endblock %}
